  /admin/student-parent-relations:
    get:
      tags: [Admin]
      summary: Ambil daftar relasi siswa-orang tua
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: student_id
          schema:
            type: integer
            format: int64
        - in: query
          name: parent_id
          schema:
            type: integer
            format: int64
        - in: query
          name: is_active
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: Daftar relasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentParentRelationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Buat relasi siswa-orang tua
      description: |
        Backend wajib memastikan:
        - student_id adalah role siswa;
        - parent_id adalah role orang_tua;
        - kombinasi student_id dan parent_id belum ada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateStudentParentRelationRequest'
      responses:
        '201':
          description: Relasi berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStudentParentRelationDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
