          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/track:
    post:
      tags: [Analytics]
      summary: Track analytics event
      description: Opsional. Pada MVP event utama sebaiknya juga dicatat otomatis dari backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackEventRequest'
      responses:
        '200':
          description: Event berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicSuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    StudentIdPath:
      in: path
      name: studentId
      required: true
      schema:
        type: integer
        format: int64
    ClassIdPath:
      in: path
      name: classId
      required: true
      schema:
        type: integer
        format: int64
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    StartDate:
      in: query
      name: start_date
      schema:
        type: string
        format: date
    EndDate:
      in: query
      name: end_date
      schema:
        type: string
        format: date

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseSimple'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseSimple'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseSimple'
    Conflict:
      description: Konflik data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseSimple'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseValidation'

  schemas:
    ValidationSource:
      type: string
      enum: [rumah, sekolah]
      example: rumah

    ValidatorRole:
      type: string
      enum: [orang_tua, guru]
      example: guru

    RoleName:
      type: string
      enum: [siswa, orang_tua, guru, admin]
      example: siswa

    BasicSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true

    BasicNullResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
          example: null

    ErrorResponseSimple:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized

    ErrorResponseValidation:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation error
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 10

    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          $ref: '#/components/schemas/RoleName'

    ClassRef:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: 7A
        grade_level:
          type: string
          example: '7'

    UserRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        full_name:
          type: string
          example: Budi Santoso

    TeacherRef:
      type: object
      nullable: true
      properties:
        id:
          type: integer
          format: int64
          example: 21
        full_name:
          type: string
          example: Ibu Sari

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        class:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassRef'


    ProfileData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        full_name:
          type: string
          example: Budi Santoso
        username:
          type: string
          example: budi123
        email:
          type: string
          format: email
          example: budi@example.com
        phone:
          type: string
          nullable: true
          example: '081234567890'
        is_active:
          type: boolean
          example: true
        role:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Role'
        class:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ClassRef'

    ProfileResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Profil berhasil diambil.
        data:
          $ref: '#/components/schemas/ProfileData'

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 255
          example: Budi Santoso
        username:
          type: string
          maxLength: 255
          example: budi123
        email:
          type: string
          format: email
          maxLength: 255
          example: budi@example.com
        phone:
          type: string
          nullable: true
          maxLength: 20
          example: '081234567890'

    UpdatePasswordRequest:
      type: object
      required: [current_password, new_password, new_password_confirmation]
      properties:
        current_password:
          type: string
          example: password123
        new_password:
          type: string
          minLength: 8
          example: passwordbaru123
        new_password_confirmation:
          type: string
          minLength: 8
          example: passwordbaru123

    AdminDashboardSummaryResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Ringkasan dashboard admin berhasil diambil.
        data:
          type: object
          properties:
            users:
              type: object
              properties:
                total_students:
                  type: integer
                  example: 120
                total_teachers:
                  type: integer
                  example: 10
                total_parents:
                  type: integer
                  example: 95
                total_admins:
                  type: integer
                  example: 1
                active_students:
                  type: integer
                  example: 115
            classes:
              type: object
              properties:
                total_classes:
                  type: integer
                  example: 6
                active_classes:
                  type: integer
                  example: 6
            today_activity:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '2026-05-25'
                today_checkins:
                  type: integer
                  example: 80
                students_checked_in_today:
                  type: integer
                  example: 80
                students_not_checked_in_today:
                  type: integer
                  example: 40
                today_total_items:
                  type: integer
                  example: 560
                today_done_items:
                  type: integer
                  example: 420
                today_parent_validations:
                  type: integer
                  example: 300
                today_teacher_validations:
                  type: integer
                  example: 250
                today_total_validations:
                  type: integer
                  example: 550
                pending_validation_items:
                  type: integer
                  example: 290
            recent_checkins:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1001
                  student_id:
                    type: integer
                    format: int64
                    example: 12
                  student_name:
                    type: string
                    nullable: true
                    example: Budi Santoso
                  class:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/ClassRef'
                  checkin_date:
                    type: string
                    format: date
                    example: '2026-05-25'
                  created_at:
                    type: string
                    format: date-time
                    nullable: true

    Habit:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: BANGUN_PAGI
        name:
          type: string
          example: Bangun Pagi
        sort_order:
          type: integer
          example: 1

    ValidationDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 501
        validator_id:
          type: integer
          format: int64
          example: 55
        validator_name:
          type: string
          example: Bapak Ahmad
        validator_role:
          $ref: '#/components/schemas/ValidatorRole'
        validation_source:
          $ref: '#/components/schemas/ValidationSource'
        validated_at:
          type: string
          format: date-time

    CheckinItemRequest:
      type: object
      required: [habit_id, is_done]
      properties:
        habit_id:
          type: integer
          format: int64
          example: 1
        is_done:
          type: boolean
          example: true

    CheckinItemDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          example: 1001
        habit_id:
          type: integer
          format: int64
          example: 1
        habit_code:
          type: string
          example: BANGUN_PAGI
        habit_name:
          type: string
          example: Bangun Pagi
        is_done:
          type: boolean
          example: true
        validations:
          type: array
          items:
            $ref: '#/components/schemas/ValidationDetail'

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          example: budi123
        password:
          type: string
          format: password
          example: secret123

    LoginSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          properties:
            access_token:
              type: string
              example: jwt-or-token
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 86400
            user:
              $ref: '#/components/schemas/UserSummary'

    CurrentUserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          $ref: '#/components/schemas/UserSummary'

    RolesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    HabitsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            $ref: '#/components/schemas/Habit'

    ClassListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        grade_level:
          type: string
        is_active:
          type: boolean
        teacher:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TeacherRef'

    ClassListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ClassListItem'
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    StudentTodayCheckinResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          properties:
            checkin_date:
              type: string
              format: date
            habits:
              type: array
              items:
                $ref: '#/components/schemas/Habit'
            checkin:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/CheckinDetail'

    StudentCheckinUpsertRequest:
      type: object
      required: [items]
      properties:
        checkin_date:
          type: string
          format: date
          nullable: true
          example: '2026-04-23'
          description: Optional. Jika kosong, backend memakai tanggal hari ini. Untuk MVP hanya tanggal hari ini yang valid.
        notes:
          type: string
          nullable: true
          example: Hari ini semangat
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckinItemRequest'

    CheckinDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        student_id:
          type: integer
          format: int64
        checkin_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        total_habits_done:
          type: integer
        total_items_validated:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckinItemDetail'

    StudentCheckinDetailSaveResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Check-in saved successfully
        data:
          $ref: '#/components/schemas/CheckinDetail'

    StudentCheckinDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/CheckinDetail'

    StudentCheckinHistoryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        checkin_date:
          type: string
          format: date
        total_habits_done:
          type: integer
          example: 5
        total_items_validated:
          type: integer
          example: 4
        parent_validated_items:
          type: integer
          example: 2
        teacher_validated_items:
          type: integer
          example: 2

    StudentCheckinHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/StudentCheckinHistoryItem'
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    ParentChildrenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              student_id:
                type: integer
                format: int64
              student_name:
                type: string
              class:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/ClassRef'
              relation_type:
                type: string
                example: ayah
              latest_checkin_date:
                type: string
                format: date
                nullable: true

    ParentChildCheckinListItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        checkin_date:
          type: string
          format: date
        notes:
          type: string
          nullable: true
        total_habits_done:
          type: integer
        total_items_validated:
          type: integer
        parent_pending_validation_count:
          type: integer
        teacher_validated_items:
          type: integer

    ParentChildCheckinListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
